# Local PostgreSQL for the founder's machines (same port as scripts/dev-db.sh).
#   docker compose up -d db
# DATABASE_URL=postgres://postgres:postgres@127.0.0.1:54329/studio_dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studio_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
